<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>图片加层（碎屏效果）</title>
</head>
<body>
<h1>图片加层（碎屏效果）</h1>
<p>1. 选图片 → 2. 不满意可点“随机破损”换位置和形状 → 3. 下载 PNG。</p>

<p><input type="file" id="file" accept="image/*"></p>
<p>
<button id="rand" disabled>随机破损</button>
<button id="save" disabled>下载 PNG</button>
</p>
<p>
下面亮线颜色 <input type="color" id="pc" value="#a020f0"><br>
右边亮线颜色 <input type="color" id="gc" value="#00ff00"><br>
右边亮线宽度 <input type="range" id="gw" min="1" max="8" value="1"> <span id="gwv">x1</span><br>
<button id="gr" disabled>随机横线：关</button>（随机 1~3 条细线）
</p>
<p>
<button id="zm" disabled>缩放：适应高度</button>（点击切换 适应高度 / 适应宽度 / 1:1）
</p>

<canvas id="view" hidden></canvas>

<p>
<a href="https://github.com/knvbepr/DuoBreakWallpaper/" target="_blank" rel="noopener">GitHub 仓库</a> ·
<a href="https://blog.knvbepr.top/" target="_blank" rel="noopener">博客</a> ·
<a href="https://github.com/knvbepr" target="_blank" rel="noopener">个人 GitHub</a>
</p>

<script>
const $ = id => document.getElementById(id);
let img = null;    // 当前图片
let dmg = null;    // 当前破损参数
let grandom = false;   // 右边亮线随机模式开关
let glines = [];       // 随机模式下的右边亮线列表

// 预览缩放：点按钮在三种模式间轮换 —— 0 适应高度 / 1 适应宽度 / 2 原始 1:1
const ZMODES = ['适应高度', '适应宽度', '1:1'];
let zmode = 0;

function applyZoom() {
  if (!img) return;
  const c = $('view');
  const W = img.naturalWidth, H = img.naturalHeight;
  let z;
  if (zmode === 0) {          // 等比缩放到窗口可用高度
    const availH = window.innerHeight - c.offsetTop - 16;
    z = availH / H;
  } else if (zmode === 1) {   // 等比缩放到页面可用宽度
    const availW = document.body.clientWidth - 2;
    z = availW / W;
  } else {                    // 原始像素
    z = 1;
  }
  z = Math.min(8, Math.max(0.05, z));
  c.style.width = Math.floor(W * z) + 'px';
  $('zm').textContent = '缩放：' + ZMODES[zmode];
}

function setMode(m) {
  zmode = m % ZMODES.length;
  applyZoom();
}

// 生成一组破损参数：位置固定（水平居中、竖线终点在距底部 40% 处），
// 每次调用只随机破损块自身的不规则形状
function makeDamage(w, h) {
  const Xc = w * 0.5;
  const Yj = h * 0.6;
  const rx = w * 0.02;            // 竖椭圆横向半径
  const ry = h * 0.07;            // 竖椭圆纵向半径
  const cy = Yj + ry;             // 破损中心：椭圆顶接着竖线终点
  const pts = [];                 // 椭圆范围内的不规则多边形
  const n = 9 + Math.floor(Math.random() * 5);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    pts.push([
      Xc + Math.cos(a) * rx * (0.55 + Math.random() * 0.45),
      cy + Math.sin(a) * ry * (0.55 + Math.random() * 0.45)
    ]);
  }
  return { Xc, Yj, cy, rx, ry, pts, w, h };
}

// 破损块在 x = Xc 处的上下边界：横线的起点都落在这段黑色里，不会露出来
function damageSpan(d) {
  let top = d.cy - d.ry, bot = d.cy + d.ry;
  const P = d.pts, n = P.length;
  for (let i = 0; i < n; i++) {
    const a = P[i], b = P[(i + 1) % n];
    if (a[0] === b[0] || (a[0] - d.Xc) * (b[0] - d.Xc) > 0) continue;
    const t = (d.Xc - a[0]) / (b[0] - a[0]);
    const y = a[1] + t * (b[1] - a[1]);
    top = Math.min(top, y); bot = Math.max(bot, y);
  }
  return { top, bot };
}

// 生成右边随机亮线：主线从破损中心出发、宽度 = 滑杆宽度；
// 其余 1~3 条是细线，按破损真实边界排在主线上下的空隙里。
// 滑杆调高时只有主线变粗，细线保持基准粗细，几张线才不会连成一整片
function makeGLines(d) {
  const base = Math.max(2, d.w * 0.003);
  const maxW = base * +$('gw').value;          // 主线宽度（像素）
  const x0 = d.Xc;                             // 平头起点压在破损中轴上
  const list = [{ x0, y: d.cy, w: maxW }];

  const span = damageSpan(d);
  const pad = 4, gap = 8;                      // 与破损边缘、主线之间留的空
  const thinMax = Math.min(maxW, Math.max(2, base * 1.5));
  const zones = [                              // 主线上、下可放细线的竖直区间
    { a: span.top + pad, b: d.cy - maxW / 2 - gap },
    { a: d.cy + maxW / 2 + gap, b: span.bot - pad }
  ];

  let side = Math.random() < 0.5 ? 0 : 1;
  const n = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const w = 1 + Math.random() * (thinMax - 1);
    let z = zones[side];
    if (z.b - z.a < w) z = zones[1 - side];    // 这一侧放不下就换边
    if (z.b - z.a < w) continue;               // 两边都放不下
    list.push({ x0, y: z.a + w / 2 + Math.random() * (z.b - z.a - w), w });
    side = 1 - side;
  }
  return list;
}

// 亮线：纯色单线，无光晕；平头端点，线头不会从破损边缘外探出来
function brightLine(x, color, w, draw) {
  x.save();
  x.lineCap = 'butt';
  x.beginPath(); draw();
  x.strokeStyle = color; x.lineWidth = w; x.stroke();
  x.restore();
}

// 在 canvas 上叠加整层碎屏效果，其余地方不动（透明）
// 先画亮线再画黑色：黑色破损把亮线的内侧盖住，亮线正好从破损边缘接出来
function drawOverlay(x, w, h, d) {
  const lw = Math.max(2, w * 0.003);

  // 下面亮线（竖，默认紫）：从破损中心往下到图片底部（上端被黑色破损盖住）
  brightLine(x, $('pc').value, lw, () => {
    x.moveTo(d.Xc, d.cy); x.lineTo(d.Xc, h);
  });

  // 右边亮线（横，默认绿）：从破损内部出发到右边缘（起点被黑色破损盖住）。
  // 关：一条主线，宽度 = 滑杆倍数；开：主线 + 1~3 条错开的细线
  if (grandom) {
    glines.forEach(L => brightLine(x, $('gc').value, L.w, () => {
      x.moveTo(L.x0, L.y); x.lineTo(w, L.y);
    }));
  } else {
    brightLine(x, $('gc').value, lw * +$('gw').value, () => {
      x.moveTo(d.Xc - d.rx * 0.3, d.cy); x.lineTo(w, d.cy);
    });
  }

  // 纯黑竖线：从顶部一直画到破损中心，保证连成一体
  x.strokeStyle = '#000';
  x.lineWidth = Math.max(2, w * 0.004);
  x.beginPath(); x.moveTo(d.Xc, 0); x.lineTo(d.Xc, d.cy); x.stroke();

  // 纯黑不规则破损块（竖椭圆范围内）
  x.fillStyle = '#000';
  x.beginPath();
  d.pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]));
  x.closePath(); x.fill();
}

function render() {
  if (!img) return;
  const c = $('view');
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  drawOverlay(x, c.width, c.height, dmg);
}

$('file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  img = new Image();
  img.onload = () => {
    dmg = makeDamage(img.naturalWidth, img.naturalHeight);
    glines = makeGLines(dmg);
    render();
    $('view').hidden = false;
    $('rand').disabled = $('save').disabled = $('gr').disabled = false;
    $('zm').disabled = false;
    zmode = 0;
    applyZoom();
  };
  img.src = URL.createObjectURL(f);
};

$('rand').onclick = () => {
  dmg = makeDamage($('view').width, $('view').height);
  glines = makeGLines(dmg);   // 随机横线开着时一起重新随机
  render();
};

$('pc').oninput = $('gc').oninput = render;
$('gw').oninput = () => {
  $('gwv').textContent = 'x' + $('gw').value;
  if (grandom && dmg) glines = makeGLines(dmg);   // 宽度上限变了，重新随机
  if (img) render();
};

$('gr').onclick = () => {
  grandom = !grandom;
  $('gr').textContent = '随机横线：' + (grandom ? '开' : '关');
  if (grandom && dmg) glines = makeGLines(dmg);
  if (img) render();
};

$('zm').onclick = () => setMode(zmode + 1);
addEventListener('resize', applyZoom);

$('save').onclick = () => {
  const a = document.createElement('a');
  a.download = '碎屏效果.png';
  a.href = $('view').toDataURL('image/png');
  a.click();
};
</script>
</body>
</html>
